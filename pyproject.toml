[project]
name = "pgvector-rag"
version = "0.1.0"
description = "RAG document search API built on FastAPI, PostgreSQL with pgvector, and Redis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pylint.main]
# Two reasons, both deliberate:
#   - Docstrings are written where they explain something non-obvious. Requiring
#     one on every method produces filler that restates the signature.
#   - ruff owns import order here (the I rules). Letting pylint rule on it too
#     means two tools disagreeing about the same file.
#   - redefined-outer-name fires on every pytest fixture, because the test
#     argument necessarily shares the fixture's name.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "redefined-outer-name",
    "wrong-import-order",
    "wrong-import-position",
    "ungrouped-imports",
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
